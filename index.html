<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>할 일 관리</h1>
      <time id="today" class="today"></time>
    </header>

    <section class="progress" aria-label="진행률">
      <div class="progress-row">
        <span class="progress-label">전체 진행률</span>
        <span id="progress-text" class="progress-text">0 / 0 (0%)</span>
      </div>
      <div id="progress-bar" class="progress-bar" role="progressbar" aria-label="전체 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="progress-categories" class="progress-categories">
        <span class="cat-work">업무 0/0</span> ·
        <span class="cat-personal">개인 0/0</span> ·
        <span class="cat-study">공부 0/0</span>
      </p>
    </section>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input id="todo-input" type="text" maxlength="100" placeholder="할 일을 입력하세요..." aria-label="할 일 입력">
      <select id="todo-category" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <nav class="filters" aria-label="카테고리 필터">
      <button type="button" class="filter active" data-filter="all">전체</button>
      <button type="button" class="filter" data-filter="work">업무</button>
      <button type="button" class="filter" data-filter="personal">개인</button>
      <button type="button" class="filter" data-filter="study">공부</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="list-footer">
      <button type="button" id="clear-done" class="clear-done" disabled>완료 항목 삭제</button>
    </div>

    <p id="empty-message" class="empty-message">오늘 할 일을 추가해 보세요</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
